server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/demo/public;
    index index.php;
    server_name _;
    location / {
        try_files $uri /index.php?$query_string;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9000;
    }
}

